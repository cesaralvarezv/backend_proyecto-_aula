spring.application.name=Yireh Store Backend

# --- DataSource MySQL vía .env ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/yireh_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=${PORT:8080}
server.address=0.0.0.0

# --- Security / JWT (opcional) ---
jwt.secret=${JWT_SECRET:change-this-secret-key-min-32-chars-long-for-hs256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Logging ---
logging.level.com.backend_yireh_store=DEBUG
