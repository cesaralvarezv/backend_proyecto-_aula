<!--
  ========================================================================
  YIREH STORE — WIDGET EMBEBIBLE DE CHATBOT CON OLLAMA
  Copia este bloque en cualquier vista HTML de tu Front-End (Angular, React,
  Thymeleaf, o HTML tradicional) para habilitar el botón flotante del Chatbot.
  ========================================================================
-->

<div id="yireh-chat-widget">
    <!-- Botón Flotante -->
    <button id="yireh-widget-toggle" class="yireh-float-btn" title="Chatear con YirehBot">
        💬
    </button>

    <!-- Modal Flotante del Chat -->
    <div id="yireh-widget-window" class="yireh-modal-window" style="display: none;">
        <div class="yireh-modal-header">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 20px;">🤖</span>
                <strong>YirehBot</strong>
            </div>
            <button id="yireh-widget-close" style="background: none; border: none; color: white; cursor: pointer; font-size: 16px;">✕</button>
        </div>
        <div id="yireh-widget-messages" class="yireh-modal-body"></div>
        <form id="yireh-widget-form" class="yireh-modal-footer">
            <input type="text" id="yireh-widget-input" placeholder="Pregunta algo sobre el menú..." required />
            <button type="submit">Enviar</button>
        </form>
    </div>
</div>

<style>
.yireh-float-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #6366f1;
    color: white;
    font-size: 24px;
    border: none;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    cursor: pointer;
    z-index: 9999;
    transition: transform 0.2s;
}
.yireh-float-btn:hover { transform: scale(1.08); }
.yireh-modal-window {
    position: fixed;
    bottom: 90px;
    right: 24px;
    width: 360px;
    height: 500px;
    background: #1e293b;
    color: #f8fafc;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    z-index: 9999;
    overflow: hidden;
    font-family: sans-serif;
}
.yireh-modal-header {
    background: #0f172a;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.yireh-modal-body {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 13px;
}
.yireh-modal-footer {
    display: flex;
    padding: 10px;
    background: #0f172a;
    gap: 8px;
}
.yireh-modal-footer input {
    flex: 1;
    background: #334155;
    border: none;
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
}
.yireh-modal-footer button {
    background: #6366f1;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
}
.widget-bubble {
    padding: 8px 12px;
    border-radius: 10px;
    max-width: 80%;
    line-height: 1.4;
}
.widget-bubble.user { background: #4f46e5; align-self: flex-end; color: white; }
.widget-bubble.bot { background: #334155; align-self: flex-start; color: #f8fafc; }
</style>

<script>
(function() {
    const toggleBtn = document.getElementById('yireh-widget-toggle');
    const closeBtn = document.getElementById('yireh-widget-close');
    const modalWindow = document.getElementById('yireh-widget-window');
    const form = document.getElementById('yireh-widget-form');
    const input = document.getElementById('yireh-widget-input');
    const messages = document.getElementById('yireh-widget-messages');
    let session = localStorage.getItem('yireh_widget_session') || ('ws_' + Math.random().toString(36).substr(2, 9));
    localStorage.setItem('yireh_widget_session', session);

    toggleBtn.addEventListener('click', () => {
        const isHidden = modalWindow.style.display === 'none';
        modalWindow.style.display = isHidden ? 'flex' : 'none';
        if (isHidden && messages.children.length === 0) {
            appendMsg('bot', '¡Hola! Soy YirehBot. ¿En qué te ayudo hoy?');
        }
    });
    closeBtn.addEventListener('click', () => modalWindow.style.display = 'none');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        appendMsg('user', text);
        input.value = '';
        const typing = appendMsg('bot', 'Pensando...');

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId: session, message: text })
            });
            const data = await res.json();
            typing.textContent = data.content || 'Sin respuesta';
        } catch(err) {
            typing.textContent = 'Error de conexión con el servidor.';
        }
    });

    function appendMsg(role, text) {
        const div = document.createElement('div');
        div.className = 'widget-bubble ' + role;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div;
    }
})();
</script>
