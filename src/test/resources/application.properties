# Configuración de base de datos H2 en memoria para pruebas unitarias y CI/CD
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT para pruebas
jwt.secret=change-this-secret-key-min-32-chars-long-for-hs256
jwt.expiration=86400000

# Credenciales de Admin para DataInitializer en pruebas
admin.email=admin@yirehstore.com
admin.password=Admin123456
admin.name=Administrador
