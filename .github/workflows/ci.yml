name: Java CI/CD Pipeline - Yireh Store Backend

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permisos de ejecución al wrapper de Maven
        run: chmod +x mvnw

      - name: Demostrar uso y enmascaramiento de GitHub Secret
        env:
          APP_ENV: ${{ secrets.APP_ENV_DEMO }}
        run: |
          echo "El entorno configurado es: $APP_ENV"
          echo "Longitud del valor del secreto recibido: ${#APP_ENV} caracteres"

      - name: Compilar proyecto (Maven Build)
        run: ./mvnw clean compile

      - name: Ejecutar pruebas unitarias
        run: ./mvnw test

      - name: Publicar reporte de cobertura JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Empaquetar aplicación (JAR)
        run: ./mvnw package -DskipTests

      - name: Subir artefacto compilado (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: yireh-store-backend-jar
          path: target/*.jar
          retention-days: 7
