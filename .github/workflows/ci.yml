name: Java CI/CD Pipeline - Yireh Store Backend

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name:  Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name:  Dar permisos de ejecución al wrapper de Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas unitarias e integración
        run: ./mvnw clean test

      - name: Empaquetar aplicación (JAR)
        run: ./mvnw package -DskipTests

      - name: Subir artefacto compilado (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: yireh-store-backend-jar
          path: target/*.jar
          retention-days: 7
